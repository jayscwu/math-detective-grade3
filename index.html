</style></head><body><header><div class="wrap"><h1>🧭 數學偵探隊</h1><p class="sub">國小三年級・文字題數量關係・互動學習家教</p></div></header><main class="wrap"><nav class="nav" aria-label="功能切換"><button class="active" data-tab="home">學習首頁</button><button data-tab="diagnosis">能力診斷</button><button data-tab="practice">互動練習</button><button data-tab="report">學習報告</button></nav><section id="home" class="panel"><h2>今天一起當數學偵探！</h2><p>先看懂「誰比較多、誰比較少」，再選擇加法或減法。遇到困難，我會一步一步給提示，不會立刻公布答案。</p><div class="grid"><div class="tile"><span class="chip">M1–M2</span><h3>看懂數量關係</h3><p>找已知、未知，學會比較長短。</p></div><div class="tile"><span class="chip">M3–M4</span><h3>線段圖與反向思考</h3><p>不能只靠「多」「少」猜算式。</p></div><div class="tile"><span class="chip">M5–M6</span><h3>公分與毫米應用</h3><p>判斷、計算、換算、檢查單位。</p></div></div><p class="muted small">這是可離線使用的單機版。你的作答只儲存在目前瀏覽器，沒有傳到伺服器。</p><div class="row"><button onclick="start('diagnosis')">先做短診斷</button><button class="ghost" onclick="start('practice')">直接開始練習</button></div></section><section id="diagnosis" class="panel" hidden></section><section id="practice" class="panel" hidden></section><section id="report" class="panel" hidden></section></main><div class="footer">以觀念理解為優先・同一題目不先洩漏答案・本網頁使用預設題庫與規則式引導，不是連線AI對話</div>

{id:'d5',level:2,kind:'difference',a:'甲繩',b:'乙繩',big:'甲繩',n:18,other:11,unit:'公分',ask:'相差',stem:'甲繩長18公分，乙繩長11公分。兩條繩子相差幾公分？'},

{id:'p10',level:3,kind:'compare',a:'哥哥',b:'妹妹',big:'哥哥',known:'big',n:125,d:36,unit:'毫米',ask:'妹妹',stem:'哥哥的鐵絲長12公分5毫米，比妹妹長36毫米。妹妹的鐵絲長幾毫米？'},
{id:'p11',level:3,kind:'compare',a:'紅帶',b:'藍帶',big:'藍帶',known:'small',n:48,d:19,unit:'毫米',ask:'藍帶',stem:'紅帶長4公分8毫米，比藍帶短19毫米。藍帶長幾毫米？'},

{id:'p13',level:3,kind:'compare',a:'甲線',b:'乙線',big:'乙線',known:'big',n:104,d:27,unit:'毫米',ask:'甲線',stem:'乙線長10公分4毫米，比甲線長27毫米。甲線長幾毫米？'},
{id:'p14',level:3,kind:'compare',a:'學校到公園',b:'學校到圖書館',big:'學校到公園',known:'big',n:67,d:19,unit:'毫米',ask:'學校到圖書館',stem:'地圖上，學校到公園是6公分7毫米，比學校到圖書館長1公分9毫米。學校到圖書館的距離是幾毫米？'},
{id:'p15',level:3,kind:'difference',a:'甲繩',b:'乙繩',big:'甲繩',n:112,other:75,unit:'毫米',ask:'相差',stem:'甲繩長11公分2毫米，乙繩長7公分5毫米。兩條繩子相差幾毫米？'},
{id:'p16',level:3,kind:'compare',a:'小宇',b:'小傑',big:'小傑',known:'small',n:76,d:27,unit:'毫米',ask:'小傑',stem:'小宇的緞帶長7公分6毫米，比小傑短2公分7毫米。小傑的緞帶長幾毫米？'}
];
const KEY='mathDetective_v1_records';let records=JSON.parse(localStorage.getItem(KEY)||'[]');let current=null,mode='practice',order=[],index=0,stage=0,hint=0,failures=0,firstWrong=false,hadHint=false,stepResponse='',currentFinished=false;const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(records))}function show(tab){document.querySelectorAll('main section').forEach(e=>e.hidden=e.id!==tab);document.querySelectorAll('.nav button').forEach(e=>e.classList.toggle('active',e.dataset.tab===tab));if(tab==='report')renderReport()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='practice'||b.dataset.tab==='diagnosis')start(b.dataset.tab);else show(b.dataset.tab)});
function values(q){if(q.kind==='difference')return {big:q.n,small:q.other,diff:q.n-q.other,result:q.n-q.other};let small=q.known==='big'?q.n-q.d:q.n;let big=small+q.d;return {big,small,diff:q.d,result:q.ask===q.big?big:small}}
function operation(q){return q.kind==='difference'||q.known==='big'?'減法':'加法'}function askName(q){return q.kind==='difference'?'相差的長度':q.ask+'的長度'}
function start(which){mode=which;order=(which==='diagnosis'?DATA.filter(x=>x.id.startsWith('d')):DATA.filter(x=>x.id.startsWith('p'))).slice();index=0;loadQuestion();show(which)}
function loadQuestion(){current=order[index];stage=0;hint=0;failures=0;firstWrong=false;hadHint=false;currentFinished=false;stepResponse='';renderQuestion()}
function renderQuestion(){let q=current,el=$(mode);if(!q){el.innerHTML='<h2>完成了！</h2><p>你已完成這一輪練習，可以看看自己的學習報告。</p><div class="row"><button onclick="show(\'report\')">查看學習報告</button><button class="ghost" onclick="start(\''+mode+'\')">再練一次</button></div>';return}let v=values(q),prompt=mode==='diagnosis'?'診斷模式：不會提供分步提示。':'練習模式：先想一想，再逐步回答。';let box='<div class="row"><span class="chip">'+(mode==='diagnosis'?'能力診斷':'互動練習')+'</span><span class="chip">L'+q.level+'</span><span class="muted">第 '+(index+1)+' / '+order.length+' 題</span></div><div class="bar" style="margin:12px 0"><div style="width:'+((index)/order.length*100)+'%"></div></div><div class="question">'+q.stem+'</div><p class="muted small">'+prompt+'</p>';
if(currentFinished){let msg=(firstWrong?'這題經過修正後完成。':'這題獨立完成！')+' 正確答案是 '+v.result+q.unit+'。'+(operation(q)==='加法'?'求較長的量，要把相差的長度加回去。':'求較短的量或相差量，要用減法。');box+='<div class="feedback good">'+msg+'</div><div class="row"><button onclick="next()">'+(index+1===order.length?'完成本輪':'下一題')+'</button><button class="ghost" onclick="show(\'report\')">查看報告</button></div>';el.innerHTML=box;return}
if(mode==='diagnosis'){box+='<p><b>選擇你認為正確的算式：</b></p><div class="choices">'+['加法','減法'].map(s=>'<button class="choice" onclick="checkOperation(\''+s+'\')">'+s+'</button>').join('')+'</div><div id="operationResult"></div>';if(stage>0)box+='<p><b>計算結果是多少？</b>（單位：'+q.unit+'）</p><div class="row"><input type="number" id="answer" inputmode="numeric" aria-label="數值答案"><button onclick="checkNumber()">送出答案</button></div><div id="numberResult"></div>';el.innerHTML=box;return}
if(stage===0){box+='<p class="kicker">第一步｜先找出比較關係</p><p><b>題目要我們求什麼？</b></p><div class="choices">'+[askName(q),q.a+'的名字',q.b+'的名字'].filter((x,i,a)=>a.indexOf(x)===i).map(s=>'<button class="choice" onclick="checkTarget(this)">'+s+'</button>').join('')+'</div>'}else if(stage===1){box+='<p class="kicker">第二步｜看懂大小關係</p><p><b>'+(q.kind==='difference'?'兩段長度中，哪個比較長？':'誰比較長？')+'</b></p><div class="choices">'+[q.a,q.b].map(s=>'<button class="choice" onclick="checkBig(\''+s+'\')">'+s+'</button>').join('')+'</div>'}else if(stage===2){box+='<p class="kicker">第三步｜選擇運算</p><p><b>你覺得應該用哪一種運算？</b></p><div class="choices"><button class="choice" onclick="checkOperation(\'加法\')">加法 ＋</button><button class="choice" onclick="checkOperation(\'減法\')">減法 −</button></div>'}else{box+='<p class="kicker">第四步｜計算並檢查單位</p><p>請填入數字，答案單位是 <strong>'+q.unit+'</strong>。</p><div class="row"><input type="number" id="answer" inputmode="numeric" aria-label="數值答案"><button onclick="checkNumber()">送出答案</button></div><p class="small muted">提醒：1公分＝10毫米。要按照題目指定的單位回答。</p>'}
box+='<div id="response" aria-live="polite"></div><div class="row" style="margin-top:12px"><button class="ghost" onclick="moreHint()">💡 給我一點提示</button>'+(stage>=1?'<button class="ghost" onclick="toggleGraph()">📏 看線段圖</button>':'')+'</div><div id="graph" class="hidden">'+graph(q)+'</div>';el.innerHTML=box}
function message(txt,bad=true){let n=$('response')||$('operationResult')||$('numberResult');if(n)n.innerHTML='<div class="feedback '+(bad?'bad':'good')+'">'+txt+'</div>'}function markWrong(error){firstWrong=true;failures++;currentError=error;if(mode==='diagnosis'){return}if(failures>=2)moreHint()}
let currentError='';function checkTarget(el){const ok=el.textContent.trim()===askName(current);if(ok){stage++;failures=0;renderQuestion()}else{markWrong('E1');message('再讀一次最後一句：「題目問的是什麼？」先不要計算。')}}function checkBig(s){if(s===current.big){stage++;failures=0;renderQuestion()}else{markWrong('E2');message('想想「比……長」或「比……短」在說誰比較長；也可以看線段圖。')}}function checkOperation(op){let trueOp=operation(current),ok=op===trueOp;if(!ok){markWrong('E3');let txt='再想想：已知的是較長、較短，還是兩個長度？要求的結果比已知數字大，還是小？';if(mode==='diagnosis'){message('已記下你的選擇。'+txt);stage=1;setTimeout(renderQuestion,1200)}else message(txt);return}stage=mode==='diagnosis'?1:3;failures=0;renderQuestion()}
function checkNumber(){let n=$('answer');if(!n)return;if(n.value===''){message('請先填寫數字。');return}let answer=Number(n.value),v=values(current);if(answer===v.result){finish();return}markWrong(current.level===3?'E5':'E4');message('這個數字還需要檢查。先確認算式，再想想單位是否與題目一致。'+(mode==='diagnosis'?'':' 可以看看線段圖或提示。'))}
function finish(){records.push({id:current.id,level:current.level,mode,wrong:firstWrong,hints:hint,error:firstWrong?currentError:'',at:new Date().toISOString()});save();currentFinished=true;renderQuestion()}function next(){index++;loadQuestion()}
function moreHint(){if(mode==='diagnosis'){message('診斷中先試著自己想一想。完成後可以到互動練習獲得提示。');return}hint=Math.min(hint+1,4);hadHint=true;let q=current,v=values(q);let t=['','先找題目中已知的數字，和最後一句要問的量。','先想：誰比較長？哪一段是多出來的？','可以把兩條線的一端對齊，再看哪一段比較長。已知較長的量、求較短的量時，應取走差距。','請先看線段圖，試著列出算式。想一想答案應比哪個已知量大或小。'];message('提示 '+hint+'：'+t[hint],false);if(hint>=3)$('graph')?.classList.remove('hidden')}
function toggleGraph(){$('graph')?.classList.toggle('hidden')}
function graph(q){let v=values(q),w=245,max=v.big||1,part=Math.max(30,w*(v.small/max)),delta=Math.max(0,w-part),large=q.big,small=q.a===large?q.b:q.a;let topLabel=(q.kind==='difference'||q.known==='big')?v.big+q.unit:'？'+q.unit,botLabel=q.kind==='difference'?v.small+q.unit:(q.known==='small'?v.small+q.unit:'？'+q.unit);return '<svg class="linegraph" viewBox="0 0 410 168" role="img" aria-label="兩段長度比較的線段圖"><text x="12" y="42" font-size="14" fill="#173452">'+large+'</text><text x="12" y="112" font-size="14" fill="#173452">'+small+'</text><rect x="100" y="27" width="245" height="25" rx="4" fill="#8cbee9"/><rect x="100" y="97" width="'+part+'" height="25" rx="4" fill="#8cbee9"/><rect x="'+(100+part)+'" y="97" width="'+delta+'" height="25" fill="#f6dba5" stroke="#cf9d44" stroke-dasharray="3 3"/><text x="222" y="20" text-anchor="middle" font-size="14" fill="#173452">'+topLabel+'</text><text x="'+(100+part/2)+'" y="145" text-anchor="middle" font-size="14" fill="#173452">'+botLabel+'</text><text x="'+(100+part+delta/2)+'" y="92" text-anchor="middle" font-size="12" fill="#946116">差距</text></svg>'}
function renderReport(){let el=$('report'),r=records,total=r.length,correct=r.filter(x=>!x.wrong).length,latest=r.slice(-12),count={};r.forEach(x=>{if(x.error)count[x.error]=(count[x.error]||0)+1});let names={E1:'找出題目要求',E2:'判斷大小關係',E3:'選擇加減法',E4:'計算正確性',E5:'公分毫米換算',E6:'指定單位作答'};el.innerHTML='<h2>我的學習報告</h2><p class="muted">資料儲存於本機瀏覽器，不需註冊帳號。</p><div class="grid"><div class="tile"><b>'+total+'</b>完成題數</div><div class="tile"><b>'+correct+'</b>首次作答過程無錯誤</div><div class="tile"><b>'+(total?Math.round(correct/total*100):0)+'%</b>首次過程正確率</div></div><h3>最近練習</h3>'+(latest.length?'<div class="grid">'+latest.map(x=>'<div class="tile"><b style="font-size:16px">'+(x.mode==='diagnosis'?'診斷':'練習')+' · '+x.id+'</b>'+(!x.wrong?'獨立完成':'有錯誤後修正')+' · L'+x.level+'</div>').join('')+'</div>':'<p>尚無資料，先去完成一題吧。</p>')+'<h3>建議補強的能力</h3>'+(Object.keys(count).length?Object.entries(count).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<p>• '+(names[k]||k)+'：出現 '+v+' 次</p>').join(''):'<p>目前沒有已記錄的錯誤，繼續練習不同題型。</p>')+'<div class="row"><button class="ghost" onclick="exportReport()">下載學習紀錄 JSON</button><button class="danger" onclick="resetRecords()">清除本機紀錄</button></div><p class="small muted">提示：這是教學輔助紀錄，不是正式測驗成績。同一題重做可能影響統計；錯誤代碼是初步推估，必要時應由家長或教師協助確認。</p>'}
function exportReport(){const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),records},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='文字題學習紀錄.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),300)}function resetRecords(){if(confirm('確定清除本機所有作答紀錄？這個動作無法復原。')){records=[];save();renderReport()}}
show('home');
</script></body></html>
